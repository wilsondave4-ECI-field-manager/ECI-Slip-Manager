name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/release_v07_trigger.txt"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ECI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ECI_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ECI_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ECI_KEYSTORE_PASSWORD" && exit 1)

      - name: Restore permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ECI_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ECI-Slip-Manager-release.p12"

      - name: Build signed release APK
        env:
          ECI_KEYSTORE_PATH: ${{ runner.temp }}/ECI-Slip-Manager-release.p12
          ECI_KEYSTORE_PASSWORD: ${{ secrets.ECI_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ECI-Slip-Manager-v0.7-signed
          path: app/build/outputs/apk/release/app-release.apk
