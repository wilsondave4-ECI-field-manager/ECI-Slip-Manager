name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Apply source compatibility fixes
        run: |
          sed -i '/import androidx.compose.foundation.layout.weight/d' app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt
          sed -i 's/import androidx.compose.ui.text.input.KeyboardOptions/import androidx.compose.foundation.text.KeyboardOptions/' app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt
      - name: Persist source compatibility fixes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix Compose source imports"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECI-Slip-Manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
