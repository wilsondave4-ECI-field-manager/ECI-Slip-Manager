name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record workflow run ID
        run: |
          echo "$GITHUB_RUN_ID" > .github/latest_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest_run_id.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record latest Android build run [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Apply v0.5.1 UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt')
          text = path.read_text()

          old = '    val visibleSlips = if (selectedAdvanceId == null) slips else slips.filter { it.advanceId == selectedAdvanceId }'
          new = '''    val activeAdvanceIds = advances.asSequence().filterNot { it.archived }.map { it.id }.toSet()
              val visibleSlips = when {
                  selectedAdvanceId == null -> slips.filter { it.advanceId != null && it.advanceId in activeAdvanceIds }
                  selectedAdvance?.archived == true -> emptyList()
                  else -> slips.filter { it.advanceId == selectedAdvanceId }
              }'''
          if old not in text:
              raise SystemExit('Could not find visibleSlips block')
          text = text.replace(old, new, 1)

          old = '''                MoneyField("Amount returned", amount, { amount = it })
                          DateField(date, { date = it })
                          TextFieldSimple("Notes", notes, { notes = it })'''.replace('                          ', '                ')
          new = '''                MoneyField("Amount returned", amount, { amount = it })
                DateField(date, { date = it })
                TextFieldSimple("Reason for money returned", notes, { notes = it })'''
          if old not in text:
              raise SystemExit('Could not find return reason field')
          text = text.replace(old, new, 1)

          old = '''        if (visibleSlips.isEmpty()) {
            item { InfoCard("No slips for this advance", "Scan a slip and it will be allocated to the newest advance by default.") }
        } else {'''
          new = '''        if (visibleSlips.isEmpty()) {
            item {
                InfoCard(
                    "No recent slips",
                    if (selectedAdvance?.archived == true)
                        "This advance is archived. Its slips remain stored but are removed from Recent slips."
                    else
                        "Scan a slip and it will be allocated to the newest active advance by default."
                )
            }
        } else {'''
          if old not in text:
              raise SystemExit('Could not find recent slips empty state')
          text = text.replace(old, new, 1)

          old = '        mutableStateOf(original.advanceId ?: if (original.id == 0L) advances.firstOrNull()?.id else null)'
          new = '        mutableStateOf(original.advanceId ?: if (original.id == 0L) advances.firstOrNull { !it.archived }?.id else null)'
          if old not in text:
              raise SystemExit('Could not find new slip default advance')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Persist verified v0.5.1 source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply ECI Slip Manager v0.5.1 source [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECI-Slip-Manager-v0.5.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
