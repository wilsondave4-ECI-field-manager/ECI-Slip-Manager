name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record signed release run ID
        run: |
          echo "$GITHUB_RUN_ID" > .github/latest_signed_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest_signed_run_id.txt
          git commit -m "Record signed release run [skip ci]"
          git push

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ECI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ECI_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ECI_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ECI_KEYSTORE_PASSWORD" && exit 1)

      - name: Restore permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ECI_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ECI-Slip-Manager-release.p12"

      - name: Build signed release APK
        env:
          ECI_KEYSTORE_PATH: ${{ runner.temp }}/ECI-Slip-Manager-release.p12
          ECI_KEYSTORE_PASSWORD: ${{ secrets.ECI_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ECI-Slip-Manager-v0.9.3-signed
          path: app/build/outputs/apk/release/app-release.apk

      - name: Verify upgrade signing identity and publish versioned download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This version already has a published download; retaining it unchanged."
            exit 0
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          PREVIOUS="$RUNNER_TEMP/eci-previous-release"
          mkdir -p "$PREVIOUS"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern ECI-Slip-Manager.apk --dir "$PREVIOUS"
          CURRENT_CERT=$("$APKSIGNER" verify --print-certs "$PREVIOUS/ECI-Slip-Manager.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          NEXT_CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$CURRENT_CERT"
          test "$CURRENT_CERT" = "$NEXT_CERT" || { echo "Signing certificate differs from the installed release."; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk ECI-Slip-Manager.apk
          sha256sum ECI-Slip-Manager.apk > SHA256SUMS.txt
          printf '%s\n' "Project funding requests support Operations project selection, category amounts and quotes stored while offline." "Includes the previous refund and settled-advance fixes." "Install this update over the existing app to retain offline records. Do not uninstall the app." > "$RUNNER_TEMP/eci-release-notes.txt"
          gh release create "$TAG" ECI-Slip-Manager.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ECI Slip Manager $VERSION" --notes-file "$RUNNER_TEMP/eci-release-notes.txt" --latest
