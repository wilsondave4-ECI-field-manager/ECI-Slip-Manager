      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECI-Slip-Manager-v0.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Persist verified v0.6 UI source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply ECI Slip Manager v0.6 UI [skip ci]"
          fi
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
