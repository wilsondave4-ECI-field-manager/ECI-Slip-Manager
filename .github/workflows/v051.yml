name: Verify ECI Slip Manager v0.5.1

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/trigger_v051_2.txt"

permissions:
  contents: write

jobs:
  build-v051:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record v0.5.1 run ID
        run: |
          echo "$GITHUB_RUN_ID" > .github/v051_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v051_run_id.txt
          git commit -m "Record v0.5.1 verification run [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Apply recent-slip and return-reason changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt')
          text = path.read_text()

          old = '    val visibleSlips = if (selectedAdvanceId == null) slips else slips.filter { it.advanceId == selectedAdvanceId }'
          new = '''    val activeAdvanceIds = advances.asSequence().filterNot { it.archived }.map { it.id }.toSet()
              val visibleSlips = when {
                  selectedAdvanceId == null -> slips.filter { it.advanceId != null && it.advanceId in activeAdvanceIds }
                  selectedAdvance?.archived == true -> emptyList()
                  else -> slips.filter { it.advanceId == selectedAdvanceId }
              }'''
          if old not in text:
              raise SystemExit('visibleSlips block not found')
          text = text.replace(old, new, 1)

          marker = '@Composable\nprivate fun ReturnMoneyDialog'
          before, after = text.split(marker, 1)
          old_reason = 'TextFieldSimple("Notes", notes, { notes = it })'
          if old_reason not in after:
              raise SystemExit('return reason field not found')
          after = after.replace(old_reason, 'TextFieldSimple("Reason for money returned", notes, { notes = it })', 1)
          text = before + marker + after

          old_default = '        mutableStateOf(original.advanceId ?: if (original.id == 0L) advances.firstOrNull()?.id else null)'
          new_default = '        mutableStateOf(original.advanceId ?: if (original.id == 0L) advances.firstOrNull { !it.archived }?.id else null)'
          if old_default not in text:
              raise SystemExit('new slip default advance not found')
          text = text.replace(old_default, new_default, 1)

          path.write_text(text)
          PY

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECI-Slip-Manager-v0.5.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Persist verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply ECI Slip Manager v0.5.1 source [skip ci]"
          fi
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
