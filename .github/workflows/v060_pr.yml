name: Verify ECI Slip Manager v0.6 PR

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-v060:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Apply v0.6 UI changes
        run: |
          python .github/scripts/apply_v060.py
          python .github/scripts/fix_v060_home.py

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECI-Slip-Manager-v0.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Persist verified v0.6 UI source to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/za/co/eci/slipmanager/ui/SlipApp.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply ECI Slip Manager v0.6 UI [skip ci]"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
